// demo.proto — messages published by tools/test_publisher.py and decoded by
// the Flutter viewer (lib/proto/, generated).
//
// Regenerate both language bindings with:  bash tools/gen_messages.sh
//
// Every publisher that sends one of these sets the zenoh encoding to
// `application/protobuf;zenoh_demo.<Message>`; the schema suffix is how the
// viewer picks the decoder, since protobuf bytes are not self-describing.
syntax = "proto3";

package zenoh_demo;

// Metadata carried as field 1 of every message. Nanoseconds since the UNIX
// epoch so coarser units are exact integer divides (ms = ns / 1'000'000).
message Header {
  uint64 timestamp_ns = 1;
  // Monotonically increasing per-publisher sequence number. Gaps mean
  // dropped samples.
  uint64 seq = 2;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Inertial measurement unit sample (test/imu, 50 Hz).
message Imu {
  Header header = 1;
  Vector3 accel = 2;  // m/s^2
  Vector3 gyro = 3;   // rad/s
  double temp = 4;    // degrees C
}

// One encoded camera frame (test/cam, 10 Hz).
message Image {
  Header header = 1;
  uint32 width = 2;
  uint32 height = 3;
  // Container of `data`: "jpeg" or "png".
  string format = 4;
  bytes data = 5;
}

// Opaque bytes (test/raw, 5 Hz).
message Raw {
  Header header = 1;
  bytes data = 2;
}
